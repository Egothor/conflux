name: Release

on:
  push:
    tags:
      - 'release@*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - name: Check out release tag
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Validate release version and configuration
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          CENTRAL_BEARER_TOKEN: ${{ secrets.CENTRAL_BEARER_TOKEN }}
          MAVEN_SIGNING_KEY: ${{ secrets.MAVEN_SIGNING_KEY }}
        run: |
          [[ "$RELEASE_TAG" =~ ^release@[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo 'Release tags must have the form release@1.2.3' >&2
            exit 1
          }
          test -n "$CENTRAL_BEARER_TOKEN" || { echo 'Missing CENTRAL_BEARER_TOKEN' >&2; exit 1; }
          test -n "$MAVEN_SIGNING_KEY" || { echo 'Missing MAVEN_SIGNING_KEY' >&2; exit 1; }
          echo "RELEASE_VERSION=${RELEASE_TAG#release@}" >> "$GITHUB_ENV"

      - name: Run checks
        run: ./gradlew clean check --no-daemon -PreleaseVersion="$RELEASE_VERSION"

      - name: Build signed Maven repository
        env:
          MAVEN_SIGNING_KEY: ${{ secrets.MAVEN_SIGNING_KEY }}
          MAVEN_SIGNING_PASSWORD: ${{ secrets.MAVEN_SIGNING_PASSWORD }}
        run: |
          ./gradlew publishMavenJavaPublicationToCentralBundleRepository --no-daemon -PreleaseVersion="$RELEASE_VERSION"
          test -d "build/central-repository/org/egothor/conflux/$RELEASE_VERSION"

      - name: Create Central bundle
        working-directory: build/central-repository
        run: |
          # Repository metadata is not part of a Central deployment bundle.
          find . -type f -name 'maven-metadata*' -delete
          # Gradle generates payload checksums; Central also accepts detached signatures.
          find . -type f -name '*.asc.*' -delete
          zip -r ../central-bundle.zip org

      - name: Save release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: central-${{ env.RELEASE_VERSION }}
          path: |
            build/central-bundle.zip
            build/libs/*.jar
          if-no-files-found: error

      - name: Publish to Maven Central and await publication
        env:
          CENTRAL_BEARER_TOKEN: ${{ secrets.CENTRAL_BEARER_TOKEN }}
        run: |
          deployment_id=$(curl --fail-with-body --silent --show-error \
            --header "Authorization: Bearer $CENTRAL_BEARER_TOKEN" \
            --form 'bundle=@build/central-bundle.zip' \
            "https://central.sonatype.com/api/v1/publisher/upload?publishingType=AUTOMATIC&name=conflux-$RELEASE_VERSION")
          [[ "$deployment_id" =~ ^[0-9a-fA-F-]{36}$ ]] || {
            echo "Unexpected Central deployment response: $deployment_id" >&2
            exit 1
          }
          echo "Central deployment: $deployment_id"
          echo "Central deployment: \`$deployment_id\`" >> "$GITHUB_STEP_SUMMARY"
          for attempt in $(seq 1 150); do
            response=$(curl --fail-with-body --silent --show-error \
              --request POST --header "Authorization: Bearer $CENTRAL_BEARER_TOKEN" \
              "https://central.sonatype.com/api/v1/publisher/status?id=$deployment_id")
            state=$(jq -er '.deploymentState' <<< "$response")
            echo "Central state: $state"
            case "$state" in
              PUBLISHED) exit 0 ;;
              FAILED) jq . <<< "$response"; exit 1 ;;
              PENDING|VALIDATING|VALIDATED|PUBLISHING) sleep 20 ;;
              *) echo "Unexpected Central state: $state" >&2; exit 1 ;;
            esac
          done
          echo "Timed out awaiting Central publication; inspect deployment $deployment_id before retrying." >&2
          exit 1

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" build/libs/*.jar \
            --verify-tag --title "Conflux $RELEASE_VERSION" --generate-notes
